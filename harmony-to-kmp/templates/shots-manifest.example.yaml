# skill: harmony-to-kmp — SHOT_PLATFORM=harmony（别名 ohos-native）
# 真值落盘（不进 git）：
#   ~/Desktop/harmony-shots/<module>/
# DEVICE：verify_ohos 对比 KMP 前台 vs 上述真值；禁 Android/iOS 作对比源
# reuse.preferExisting 默认 true：目标 file 已存在则跳过重截
version: 1
platform: harmony
appId: com.example.harmony.app
reuse:
  preferExisting: true
# hdc device 由环境/工具链决定
defaultDevice: phone_portrait
login:
  required: true
  note: "fixture 账号见 TASK"

modules:
  - id: lightcourse
    pages:
      - id: home
        open:
          type: deep_link
          uri: "app://lightcourse/home"
        shots:
          - state: default
            waitFor: { testTag: "lc_home_root" }
            file: A-home-default-01.png
            note: "鸿蒙原生首页默认态"
          - state: after_scroll
            actions:
              - { type: swipe_pct, x1: 50, y1: 70, x2: 50, y2: 30, ms: 300 }
              - { type: click, testTag: "item_0" }
            waitFor: { testTag: "detail_root" }
            file: A-home-after-scroll-01.png
            note: "滑动后点首条"
          - state: empty
            setup: ["clear_cache_fixture"]
            waitFor: { text: "暂无内容" }
            file: A-home-empty-01.png
